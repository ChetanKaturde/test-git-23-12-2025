version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: monitorbizz_app_dev
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_NAME=Monitorbizz (Dev)
      - APP_ENV=local
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - LOG_CHANNEL=stack
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - BROADCAST_DRIVER=log
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_ENCRYPTION=null
      - MAIL_FROM_ADDRESS="hello@example.com"
      - MAIL_FROM_NAME="${APP_NAME}"
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - AWS_BUCKET=${AWS_BUCKET}
      - AWS_USE_PATH_STYLE_ENDPOINT=false
      - VITE_APP_NAME="${APP_NAME}"
      - SAIL_XDEBUG_MODE=develop,debug
      - SAIL_SKIP_CHECKS=true
    volumes:
      - .:/var/www/html
      - app_storage_dev:/var/www/html/storage
    depends_on:
      - redis
      - mailpit
    networks:
      - monitorbizz_dev_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: monitorbizz_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    networks:
      - monitorbizz_dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: monitorbizz_mailpit_dev
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      - monitorbizz_dev_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8025/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: MySQL for development
  # Uncomment if you want to use MySQL instead of SQLite
  # db:
  #   image: mysql:8.0
  #   container_name: monitorbizz_db_dev
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: dev_root_password
  #     MYSQL_DATABASE: monitorbizz_dev
  #     MYSQL_USER: monitorbizz_user
  #     MYSQL_PASSWORD: dev_password
  #   volumes:
  #     - db_data_dev:/var/lib/mysql
  #   ports:
  #     - "3306:3306"
  #   networks:
  #     - monitorbizz_dev_network
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s

volumes:
  app_storage_dev:
    driver: local

networks:
  monitorbizz_dev_network:
    driver: bridge